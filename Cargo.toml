[package]
name = "arrowmem-gate"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Leak gate for the Device Brain: text in, verdict out, nothing personal leaves the machine."

[lib]
name = "gate"
path = "src/lib.rs"

[[bin]]
name = "arrowmem-gate"
path = "src/main.rs"

[dependencies]
regex = "=1.11.1"
serde_json = "=1.0.140"
ureq = { version = "=2.12.1", default-features = false, features = ["json", "tls"] }
tiny_http = "=0.12.0"
unicode-normalization = "=0.1.25"
unicode-security = "=0.1.2"
icu_properties = "=2.4.0"
idna = "=1.1.0"

[dev-dependencies]
socket2 = "=0.5.10"
